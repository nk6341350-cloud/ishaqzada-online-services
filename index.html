function esc(s=''){
  return String(s??'').replace(
    /[&<>"']/g,
    m=>({
      '&':'&amp;',
      '<':'&lt;',
      '>':'&gt;',
      '"':'&quot;',
      "'":'&#39;'
    }[m])
  );
}

function toast(m){
  let e=document.querySelector('#toast');
  e.textContent=m;
  e.classList.add('show');
  setTimeout(()=>e.classList.remove('show'),2500);
}

function apiReady(){
  if(!sb){
    toast('لومړی config.js کې Supabase URL او Key واچوئ');
    return false;
  }
  return true;
}

async function rpc(fn,args={}){
  if(!apiReady()) throw new Error('Supabase not configured');
  let {data,error}=await sb.rpc(fn,args);
  if(error) throw error;
  return data;
}

async function upload(file,prefix='img'){
  if(!file||!file.size) return '';

  let ext=(file.name.split('.').pop()||'jpg')
    .replace(/[^a-z0-9]/gi,'');

  let path=
    `${prefix}/${Date.now()}-${Math.random()
      .toString(36)
      .slice(2)}.${ext}`;

  let {error}=await sb.storage
    .from('ishaqzada-images')
    .upload(path,file,{upsert:false});

  if(error) throw error;

  return sb.storage
    .from('ishaqzada-images')
    .getPublicUrl(path)
    .data.publicUrl;
}

    return;
  }
  const isiOS=/iphone|ipad|ipod/i.test(navigator.userAgent);
  if(isiOS){
    alert(lang==='en'
      ?'To put the app on your Home Screen: open this site in Safari, tap Share, then tap Add to Home Screen.'

      ?'Open the browser menu and choose Install app or Add to Home screen.'
      :'د براوزر مینو خلاص کړه او Install app یا Add to Home screen ووهه.');

function whatsappNumber(value=''){
  let n=String(value||'').replace(/\D/g,'');
  if(n.startsWith('0093')) n=n.slice(2);
  if(n.startsWith('93')) return n;
  if(n.startsWith('0')) return '93'+n.slice(1);
  if(n.length===9) return '93'+n;
  return n;
}

async function copyProduct(p){
  const lines=[
    `${lang==="en"?"Product":lang==="fa"?"محصول":"جنس"}: ${p.name||""}`,
    `${lang==="en"?"Price":lang==="fa"?"قیمت":"قیمت"}: ${Number(p.price||0).toLocaleString("en-US")} AFN`,
    `${lang==="en"?"Category":lang==="fa"?"دسته‌بندی":"کټګوري"}: ${p.category||""}`,
    `${lang==="en"?"Stock":lang==="fa"?"باقی":"پاتې"}: ${p.quantity??""}`
  ];
  const description=p.address||p.description||p.province||"";
  if(description){
    lines.push(`${lang==="en"?"Description":lang==="fa"?"توضیحات":"تشریحات"}: ${description}`);
  }
  if(p.photo_url){
    lines.push(`${lang==="en"?"Photo":lang==="fa"?"عکس":"عکس"}: ${p.photo_url}`);
  }
  const value=lines.join("\n");
  try{
    await navigator.clipboard.writeText(value);
    toast(lang==="en"?"Product copied":lang==="fa"?"محصول کامل کپی شد":"جنس کاپي شو");
  }catch(e){
    const ta=document.createElement("textarea");
    ta.value=value; document.body.appendChild(ta); ta.select();
    document.execCommand("copy"); ta.remove();
    toast(lang==="en"?"Product copied":lang==="fa"?"محصول کامل کپی شد":"جنس کاپي شو");
  }
}

      <form id="adminEditProductForm" class="form">
        <div class="field">
          <label>${t('photo')}</label>
          <input name="photo" type="file" accept="image/*">
          <small class="muted">${lang==="en"?"Leave empty to keep current photo":lang==="fa"?"برای حفظ عکس فعلی خالی بگذارید":"که عکس نه بدلوې، دا خانه تشه پرېږده"}</small>
        </div>

        <div class="field">
          <label>${t('productName')}</label>
          <input name="name" value="${esc(p.name||"")}" required>
        </div>

        <div class="grid-2">
          <div class="field">
            <label>${t('price')}</label>
            <input name="price" type="number" min="0" value="${Number(p.price||0)}" required>
          </div>
        </div>

        <div class="field">
          <label>${t('category')}</label>
          <select name="category">
            ${cats.map(c=>`<option ${p.category===c?'selected':''}>${c}</option>`).join('')}
          </select>
        </div>

        <div class="field">
          <label>${lang==="en"?"Product details":lang==="fa"?"توضیحات محصول":"د جنس تشریحات / تفصیلات"}</label>
          <textarea name="address" rows="5">${esc(p.address||"")}</textarea>
        </div>

        <div class="card-actions">
          <button class="btn btn-primary">${t('save')}</button>
          <button type="button" class="btn btn-soft" id="cancelAdminEdit">✕</button>
        </div>
      </form>
    </div>
  `;

  document.querySelector('#cancelAdminEdit').onclick=()=>renderAdminTab('products');

  document.querySelector('#adminEditProductForm').onsubmit=async e=>{
    e.preventDefault();
    try{
      const f=new FormData(e.target);
      let photo='';
      if(f.get('photo')?.size){
        photo=await upload(f.get('photo'),'products');
      }

      await rpc('admin_update_product',{
        p_pin:adminPin,
        p_product_id:p.id,
        p_name:f.get('name'),
        p_quantity:Number(p.quantity||1),
        p_price:+f.get('price'),
        p_category:f.get('category'),
        p_province:p.province||'',
        p_address:f.get('address'),
        p_photo_url:photo
      });

      toast(lang==="en"?"Product updated":lang==="fa"?"محصول ویرایش شد":"جنس اصلاح شو");
      renderAdminTab('products');
    }catch(x){
      toast(x.message);
    }
  };
}

function ishAIReply(q=''){
  const raw=String(q||'').trim();
  const x=raw.toLowerCase();
  const products=Array.isArray(window.ISHAQZADA_PRODUCTS)?window.ISHAQZADA_PRODUCTS:[];

  if(!x) return 'مهرباني وکړئ خپله پوښتنه ولیکئ.';

  const fmt=n=>Number(n||0).toLocaleString('en-US')+' AFN';
  const details=p=>{
    const d=p.address||p.description||'تشریح نه ده ثبت شوې';
    return `جنس: ${p.name}\nقیمت: ${fmt(p.price)}\nکټګوري: ${p.category||'-'}\nپاتې: ${p.quantity??0}\nتشریحات: ${d}`;
  };

  const exact=products.find(p=>{
    const n=String(p.name||'').toLowerCase().trim();
    return n && (x.includes(n) || n.includes(x));
  });
  if(exact) return details(exact);

  const words=x.split(/\s+/).filter(w=>w.length>=3);
  const fuzzy=products.find(p=>{
    const n=String(p.name||'').toLowerCase();
    return words.some(w=>n.includes(w));
  });
  if(fuzzy && /قیمت|تفصیل|تشریح|معلومات|شته|پاتې|جنس|محصول/.test(x)){
    return details(fuzzy);
  }

  if(/ارزان|ارزانه|کم قیمت|cheap|cheapest/.test(x) && products.length){
    const p=[...products].sort((a,b)=>Number(a.price||0)-Number(b.price||0))[0];
    return `تر ټولو ارزانه موجود جنس:\n${details(p)}`;
  }

  if(/ګران|گران|زیات قیمت|expensive|highest/.test(x) && products.length){
    const p=[...products].sort((a,b)=>Number(b.price||0)-Number(a.price||0))[0];
    return `تر ټولو لوړ قیمت لرونکی جنس:\n${details(p)}`;
  }

  if(/څو جنس|څومره جنس|تعداد محصولات|how many/.test(x)){
    return `اوس په سټور کې ${products.length} جنسونه ښکاري.`;
  }

  const cat=cats.find(c=>x.includes(String(c).toLowerCase()));
  if(cat){
    const list=products.filter(p=>p.category===cat);
    if(!list.length) return `د «${cat}» په کټګورۍ کې اوس جنس نه ښکاري.`;
    return `د «${cat}» جنسونه:\n`+list.slice(0,8).map(p=>`• ${p.name} — ${fmt(p.price)}`).join('\n');
  }

  if(/نصب|install|هوم|home screen/.test(x)){
    return 'په Android کې «نصب اپ» ووهئ؛ که براوزر اجازه ورکړي د Install کړکۍ سمدستي راځي. په iPhone کې Safari → Share → Add to Home Screen وکاروئ.';
  }

  if(/کاپي|copy|آرډر|ارډر|سفارش|دوکاندار|واتساپ|واټساپ|whatsapp/.test(x)){
    return 'د خوښ شوي جنس لاندې «جنس کاپي کړه» ووهئ. نوم، قیمت، کټګوري، پاتې تعداد، تشریحات او د عکس لینک کاپي کېږي؛ بیا یې دوکاندار ته په WhatsApp یا بل پیغام کې ولېږئ.';
  }

  if(/اډمین|admin|ایډیټ|edit/.test(x)){
    return 'یوازې اډمین نوی جنس ثبت، ایډیټ او حذف کولی شي. د ایډیټ له لارې نوم، قیمت، تعداد، کټګوري، تشریحات او عکس بدلولی شي.';
  }

  if(/تشریح|تفصیل|معلومات/.test(x)){
    return 'د هر جنس په کارت کې قیمت، پاتې تعداد، کټګوري او تشریحات ښکاري. که د کوم ځانګړي جنس معلومات غواړئ، د هغه نوم ولیکئ.';
  }

  if(/لټون|search|پیدا/.test(x)){
    return 'د لټون په خانه کې د جنس نوم ولیکئ، یا له کټګوریو څخه اړونده کټګوري وټاکئ.';
  }

  if(/قیمت|price/.test(x)){
    return 'د کوم جنس قیمت غواړئ؟ د جنس نوم ولیکئ، زه به یې د اوسني سټور له معلوماتو څخه درته ووایم.';
  }

  return 'زه د اسحاقزاده انلاین سټور د اوسنیو جنسونو او د اپ استعمال په اړه مرسته کوم. د جنس نوم، قیمت، تشریحات، کټګوري، نصب، کاپي یا اډمین په اړه پوښتنه وکړئ.';
}

  btn.style.cssText='position:fixed;left:16px;bottom:18px;z-index:9999;border:0;border-radius:999px;padding:14px 16px;background:#0b2348;color:#fff;font-weight:800;font-size:16px;box-shadow:0 8px 24px rgba(0,0,0,.25)';
  document.body.appendChild(btn);

  const panel=document.createElement('div');
  panel.id='ishAIPanel';
  panel.style.cssText='display:none;position:fixed;left:14px;right:14px;bottom:84px;z-index:9999;background:#fff;border:1px solid #d9e2ef;border-radius:18px;padding:14px;box-shadow:0 14px 40px rgba(0,0,0,.25);max-width:520px;margin:auto';
  panel.innerHTML=`
    <div style="display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px">
      <strong style="font-size:18px">🤖 د اسحاقزاده AI مرسته</strong>
      <button id="ishAIClose" type="button" style="border:0;background:#eef3f9;border-radius:10px;padding:6px 10px;font-size:18px">×</button>
    </div>
    <div style="font-size:14px;color:#667085;margin-bottom:10px">د اسحاقزاده انلاین سټور په اړه خپله پوښتنه ولیکئ.</div>
    <div id="ishAIAnswer" style="background:#f6f8fb;border-radius:12px;padding:10px;min-height:48px;margin-bottom:10px;white-space:pre-line;line-height:1.8">سلام! څنګه مرسته درسره وکړم؟</div>
    <div style="display:flex;gap:8px">
      <input id="ishAIInput" placeholder="پوښتنه ولیکئ..." style="flex:1;padding:12px;border:1px solid #d9e2ef;border-radius:12px">
      <button id="ishAISend" type="button" class="btn btn-navy">ولېږه</button>
    </div>`;
  document.body.appendChild(panel);

  btn.onclick=()=>panel.style.display=panel.style.display==='none'?'block':'none';
  panel.querySelector('#ishAIClose').onclick=()=>panel.style.display='none';
  const ask=()=>{
    const input=panel.querySelector('#ishAIInput');
    panel.querySelector('#ishAIAnswer').textContent=ishAIReply(input.value);
    input.value='';
  };
  panel.querySelector('#ishAISend').onclick=ask;
  panel.querySelector('#ishAIInput').addEventListener('keydown',e=>{if(e.key==='Enter') ask();});
}

window.addEventListener('load',mountIshaqzadaAI);

async function route(){

  document.documentElement.dir=
    lang==='en'
    ?'ltr'
    :'rtl';

  let select=document.querySelector('#langSelect');

  if(select){
    select.value=lang;
  }

  let r=(location.hash||'#shop').slice(1);

  if(r==='home'){
    location.hash='shop';
    return;
  }

  if(r==='shop'){
    await shop();
  }

  else if(r==='admin'){
    admin();
  }
else{
    location.hash='shop';
    return;
  }

  document
    .querySelectorAll('[data-i18n]')
    .forEach(e=>{
      e.textContent=t(e.dataset.i18n);
    });
}

window.addEventListener(
  'hashchange',
  route
);

setLang(lang);
